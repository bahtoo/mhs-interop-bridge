# Vendor profile: clinical chemistry analyzer over ASTM E1381/E1394.
# Fictional vendor and model. Built from public standards only.
# A profile is data, not code: adding a vendor means adding one of these files.
profile_version: "0.1.0"
device_id: chem-01
vendor: Acme Diagnostics (fictional)
model: ChemPro 900
device_type: clinical_chemistry_analyzer
protocol: astm
risk_class: specimen_processing

astm:
  test_id_component: 4        # R.3 universal test id "^^^GLU": code is component 4
  specimen_record: O
  specimen_field: 3           # O.3 specimen id
  patient_field: 3            # P.3 practice-assigned patient id

tests:
  GLU:
    decimals: 0
    loinc: "2345-7"
    display: "Glucose [Mass/volume] in Serum or Plasma"
    vendor_unit: "mmol/L"
    unit: "mg/dL"
    factor: 18.016            # mmol/L to mg/dL
    ref_low: 70
    ref_high: 99
    critical_low: 40
    critical_high: 500
    reportable_range: [10, 1000]   # review aid only
  K:
    decimals: 1
    loinc: "2823-3"
    display: "Potassium [Moles/volume] in Serum or Plasma"
    vendor_unit: "mmol/L"
    unit: "mmol/L"
    factor: 1.0
    ref_low: 3.5
    ref_high: 5.1
    critical_low: 2.8
    critical_high: 6.2

# Vendor result flags (R.7) mapped to canonical instrument conditions.
condition_flags:
  "B": foam
  "SS": short_sample
  "CL": clot

abnormal_flags: {N: N, L: L, H: H, LL: LL, HH: HH, "<": L, ">": H}

# QC targets per test and level, used by the Westgard gate.
qc:
  GLU:
    L1: {mean: 5.5, sd: 0.15}
    L2: {mean: 16.6, sd: 0.40}
  K:
    L1: {mean: 4.0, sd: 0.08}

# Operations: what the vendor's remote service sees and can do. Sensors carry their normal range, the way
# the instrument's own service screen shows them. Remote tasks run through MHS; hands-on tasks need a person
# at the instrument and are requested as work instructions.
operations:
  sensors:
    probe_pressure_kpa: {normal: [-45, -30], value: -38}
    incubator_c: {normal: [36.8, 37.2], value: 37.0}
  reagents:
    GLU: {lot: "GLU-2611A", tests_left: 412, expiry: "2027-03-31"}
    K: {lot: "K-2609C", tests_left: 380, expiry: "2027-01-15"}
  calibration:
    GLU: {lot: "GLU-2611A", valid_until: "2026-11-15"}
    K: {lot: "K-2609C", valid_until: "2026-11-20"}
  remote_tasks:
    probe_wash: "Sample probe wash cycle with cleaning solution (about 6 minutes). Clears light deposits."
    cuvette_wash: "Reaction cuvette wash and blank (about 12 minutes)."
  hands_on_tasks:
    probe_clean_manual:
      description: "Remove the sample probe and clear it with the cleaning wire."
      steps:
        - "Put the analyzer in standby; let the probe park."
        - "Remove the sample probe (two screws) and pass the cleaning wire through it until it moves freely."
        - "Refit the probe, then run the probe-position check from the maintenance menu."
      minutes: 15
    load_reagent_pack:
      description: "Load a new reagent pack for every test whose pack on board is empty."
      steps:
        - "Take the new pack from the 2-8 C fridge; check its lot and expiry against the label."
        - "Open the reagent compartment, remove the empty pack and load the new one until it clicks."
        - "Close the compartment and let the analyzer read the pack barcode."
      minutes: 5
  spare_lots:                 # the next pack in the fridge, per test
    GLU: "GLU-2614B"
    K: "K-2617A"
  schedule:
    probe_wash: daily
    cuvette_wash: weekly
  reset_limit: 2              # remote resets of one hardware fault before it goes to field service
  field_service:              # faults no remote action clears, and what the engineer brings
    E-612: {part: "04-1180 photometer lamp assembly", try_reset: true}
    E-310: {part: "02-0745 incubator heater controller board", try_reset: false}
  error_codes:
    E-217: "Aspiration pressure out of range at the sample probe."
    E-310: "Incubator temperature out of range; results from runs during it are not valid."
    E-405: "Calibration failed."
    E-612: "Photometer lamp failure. The analyzer stops; a reset may clear a transient fault."
    R-120: "Reagent pack empty for a test in the run."

# Natural-language tags. These become the agent-facing reference file, the same
# idea MHS uses to capture tacit knowledge that is not visible in code.
tags:
  - "E-217 on several specimens in a row, with short-sample flags, points to the sample probe, not to the specimens. Fix the probe before asking anyone for a new specimen."
  - "A new reagent lot needs a calibration on that lot before patient testing. Re-running QC does not fix a calibration."
  - "An incubator temperature out of range invalidates every result from the runs during it, not only the latest one. Look back through the event log to the first E-310."
  - "A hardware fault that comes back after one reset needs a field engineer and a part; more resets wear the analyzer and lose its logs."
  - "Start of day: run the due maintenance and check the reagent packs before QC, and QC before patient specimens."
  - "Results flagged B mean foam or bubbles in the sample cup. This is a physical problem. Re-running the same cup will not fix it; the specimen must be re-spun or recollected."
  - "Results flagged SS mean short sample. Do not release; request a new aliquot."
  - "Patient results may only be released when the most recent QC run for that test passes Westgard rules."
  - "Critical values require documented human acknowledgement before release."
