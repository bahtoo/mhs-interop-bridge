name: claude-eval
# Manual only: it spends API credit. Needs the repository secret ANTHROPIC_API_KEY.
# Results and transcripts are uploaded as a workflow artifact; nothing is committed automatically.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id (claude-haiku-5-5 for cheap iteration, claude-sonnet-5-5 for the quoted result)"
        default: "claude-sonnet-5-5"
      trials:
        description: "Trials per scenario"
        default: "3"
      scenario:
        description: "Scenarios to run, comma-separated (blank = all 23)"
        default: ""
      ablation:
        description: "Also run Claude with guardrails off"
        type: boolean
        default: true
      workers:
        description: "Parallel runs"
        default: "4"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=claude-eval::Repository secret ANTHROPIC_API_KEY is not set or is empty (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is set (${#ANTHROPIC_API_KEY} characters)"
      - run: pip install -e ".[claude]"
      - name: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          TRIALS: ${{ inputs.trials }}
          SCENARIO: ${{ inputs.scenario }}
          ABLATION: ${{ inputs.ablation }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set -o pipefail
          args=(--agents claude --model "$MODEL" --trials "$TRIALS" --workers "$WORKERS" --out "evals/claude" -v)
          if [ -n "$SCENARIO" ]; then args+=(--scenario "$SCENARIO"); fi
          if [ "$ABLATION" != "true" ]; then args+=(--no-ablation); fi
          status=0
          mhs-bridge eval "${args[@]}" 2>&1 | tee evals/claude-run.log || status=$?
          if [ "$status" -eq 0 ]; then
            cat evals/claude/results.md >> "$GITHUB_STEP_SUMMARY"
            # Headline rows as annotations, readable through the API without downloading logs
            grep -E '^\| claude' evals/claude/results.md | while IFS= read -r row; do
              echo "::notice title=claude-eval result::$row"
            done
          else
            { echo "### Eval did not complete (exit $status)"; echo '```'; tail -n 20 evals/claude-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # Surface the reason as an annotation, visible without opening the log
            echo "::error title=claude-eval aborted::$(grep -m1 'eval aborted' evals/claude-run.log || tail -n 1 evals/claude-run.log)"
            if [ -f evals/claude/results.partial.md ]; then
              { echo; cat evals/claude/results.partial.md; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-eval-${{ inputs.model }}-${{ github.run_number }}
          path: |
            evals/claude/
            evals/claude-run.log
